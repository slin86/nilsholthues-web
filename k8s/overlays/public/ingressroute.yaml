apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nilsholthues-web-slinio
spec:
  entryPoints:
    - public
  routes:
    - match: Host(`nilsholthues.slin.io`)
      kind: Rule
      services:
        - name: nilsholthues-web
          port: 80
  tls:
    secretName: slin-io-wildcard-tls   # <- an deinen bestehenden Wildcard-Secret-Namen anpassen

---
